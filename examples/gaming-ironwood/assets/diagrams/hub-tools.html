<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool hub · Frontend design skills</title>
<style>
  :root {
    --paper: #f5f3ed;
    --surface: #fffdf8;
    --raised: #ffffff;
    --soft: #ece9e0;
    --ink: #18211d;
    --ink-soft: #3d4a44;
    --muted: #6b7771;
    --line: #dedbd1;
    --line-strong: #c9c5b9;
    --accent: #0e6b58;
    --accent-soft: #e2f0eb;
    --accent-ink: #084639;
    --warm: #a66b1f;
    --warm-soft: #fbf0dd;
    --info: #2c5f8a;
    --info-soft: #e8f0f7;
    --danger: #a83c34;
    --radius: 14px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: clamp(18px, 4vw, 48px); background: var(--paper); color: var(--ink); font-family: var(--font); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .eyebrow { margin: 0; color: var(--accent); font-size: 11px; font-weight: 750; letter-spacing: 0.12em; text-transform: uppercase; }
  h1 { margin: 6px 0 0; font-size: clamp(1.5rem, 3vw, 2rem); line-height: 1.15; letter-spacing: -0.03em; }
  .lede { max-width: 66ch; margin: 8px 0 0; color: var(--muted); font-size: 13.5px; }
  .card { margin-top: 20px; overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: 0 1px 2px rgba(24,33,29,.05), 0 16px 42px rgba(24,33,29,.06); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .card-head h2 { margin: 0; font-size: 14px; }
  .card-head p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
  .badge { padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font-size: 10px; font-weight: 700; }
  .canvas { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 11px 18px; border-top: 1px solid var(--line); background: #fbfaf6; color: var(--muted); font-size: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .key { width: 8px; height: 8px; border-radius: 3px; background: var(--accent); }
  .key-warm { background: var(--warm); }
  .key-info { background: var(--info); }
  .foot { margin: 16px 0 0; color: var(--muted); font-size: 10.5px; }
  .scroll { overflow-x: auto; }
  @media (max-width: 560px) { body { padding: 14px; } .card { margin-top: 14px; } }
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">Diagram 01</p>
  <h1>Tool hub</h1>
  <p class="lede">A single design skill connects the material choices, constraints and verification tools used in every build.</p>
  <figure class="card" aria-labelledby="figure-title" style="margin-left:0;margin-right:0;">
    <div class="card-head"><div><h2 id="figure-title">How the tools connect</h2><p>Inputs are read first, material is selected second, and every surface returns to audits and reports.</p></div><span class="badge">8 tools</span></div>

    <svg class="canvas" viewBox="0 0 900 560" role="img" aria-labelledby="hub-title hub-desc">
      <title id="hub-title">Tool hub diagram</title>
      <desc id="hub-desc">The design skill sits at the centre of eight connected tools: brief, rules, palettes, type pairings, components, browser, audits and reports.</desc>
      <rect width="900" height="560" fill="#fbfaf6"/>
      <g stroke="#c9c5b9" stroke-width="1.4" fill="none">
        <path d="M210 132C280 132 290 205 355 235"/>
        <path d="M210 280H355"/>
        <path d="M210 428C280 428 290 355 355 325"/>
        <path d="M425 96V150"/>
        <path d="M425 464V410"/>
        <path d="M690 132C620 132 610 205 545 235"/>
        <path d="M690 280H545"/>
        <path d="M690 428C620 428 610 355 545 325"/>
      </g>
      <g fill="#0e6b58">
        <circle cx="210" cy="132" r="3"/><circle cx="210" cy="280" r="3"/><circle cx="210" cy="428" r="3"/>
        <circle cx="690" cy="132" r="3"/><circle cx="690" cy="280" r="3"/><circle cx="690" cy="428" r="3"/>
        <circle cx="425" cy="96" r="3"/><circle cx="425" cy="464" r="3"/>
      </g>

      <g font-family="ui-sans-serif, system-ui, sans-serif">
        <g>
          <rect x="40" y="96" width="170" height="72" rx="10" fill="#fffdf8" stroke="#dedbd1"/>
          <rect x="40" y="96" width="4" height="72" rx="2" fill="#0e6b58"/>
          <text x="58" y="122" font-size="12" font-weight="700" fill="#18211d">Brief</text>
          <text x="58" y="140" font-size="10" fill="#6b7771">Goals, audience, constraints</text>
          <text x="58" y="154" font-size="9" fill="#8a928e">Input</text>
        </g>
        <g>
          <rect x="40" y="244" width="170" height="72" rx="10" fill="#fffdf8" stroke="#dedbd1"/>
          <rect x="40" y="244" width="4" height="72" rx="2" fill="#0e6b58"/>
          <text x="58" y="270" font-size="12" font-weight="700" fill="#18211d">Rules</text>
          <text x="58" y="288" font-size="10" fill="#6b7771">Art direction and layout</text>
          <text x="58" y="302" font-size="9" fill="#8a928e">Constraints</text>
        </g>
        <g>
          <rect x="40" y="392" width="170" height="72" rx="10" fill="#fffdf8" stroke="#dedbd1"/>
          <rect x="40" y="392" width="4" height="72" rx="2" fill="#a66b1f"/>
          <text x="58" y="418" font-size="12" font-weight="700" fill="#18211d">Audits</text>
          <text x="58" y="436" font-size="10" fill="#6b7771">Contrast, layout, motion</text>
          <text x="58" y="450" font-size="9" fill="#8a928e">Verification</text>
        </g>

        <g>
          <rect x="340" y="32" width="170" height="64" rx="10" fill="#e2f0eb" stroke="#bcded3"/>
          <text x="358" y="57" font-size="12" font-weight="700" fill="#084639">Assets</text>
          <text x="358" y="75" font-size="10" fill="#3d6b60">Icons, photos, mock data</text>
        </g>
        <g>
          <rect x="340" y="464" width="170" height="64" rx="10" fill="#fbf0dd" stroke="#e7d1a9"/>
          <text x="358" y="489" font-size="12" font-weight="700" fill="#785015">Reports</text>
          <text x="358" y="507" font-size="10" fill="#8c6a31">Evidence and finish gate</text>
        </g>

        <g>
          <rect x="690" y="96" width="170" height="72" rx="10" fill="#fffdf8" stroke="#dedbd1"/>
          <rect x="856" y="96" width="4" height="72" rx="2" fill="#2c5f8a"/>
          <text x="708" y="122" font-size="12" font-weight="700" fill="#18211d">Palettes</text>
          <text x="708" y="140" font-size="10" fill="#6b7771">24 art-directed sets</text>
          <text x="708" y="154" font-size="9" fill="#8a928e">Selection</text>
        </g>
        <g>
          <rect x="690" y="244" width="170" height="72" rx="10" fill="#fffdf8" stroke="#dedbd1"/>
          <rect x="856" y="244" width="4" height="72" rx="2" fill="#2c5f8a"/>
          <text x="708" y="270" font-size="12" font-weight="700" fill="#18211d">Type</text>
          <text x="708" y="288" font-size="10" fill="#6b7771">Pairings and scale</text>
          <text x="708" y="302" font-size="9" fill="#8a928e">Selection</text>
        </g>
        <g>
          <rect x="690" y="392" width="170" height="72" rx="10" fill="#fffdf8" stroke="#dedbd1"/>
          <rect x="856" y="392" width="4" height="72" rx="2" fill="#2c5f8a"/>
          <text x="708" y="418" font-size="12" font-weight="700" fill="#18211d">Browser</text>
          <text x="708" y="436" font-size="10" fill="#6b7771">Screenshot and inspect</text>
          <text x="708" y="450" font-size="9" fill="#8a928e">Execution</text>
        </g>

        <rect x="355" y="205" width="190" height="120" rx="16" fill="#0b4c3f" stroke="#0b4c3f"/>
        <circle cx="425" cy="235" r="13" fill="none" stroke="#8fd3bd" stroke-width="1.5"/>
        <path d="M418 235h14M425 228v14" stroke="#8fd3bd" stroke-width="1.5" stroke-linecap="round"/>
        <text x="450" y="259" font-size="14" font-weight="750" fill="#eff8f3">Tool hub</text>
        <text x="450" y="278" font-size="10" fill="#b8d9cd">One system, local assets</text>
        <rect x="376" y="296" width="148" height="18" rx="9" fill="rgba(239,248,243,.12)"/>
        <text x="450" y="309" font-size="9" fill="#dff1e9" text-anchor="middle">read → compose → verify</text>
      </g>
    </svg>


    <div class="legend">
      <span><i class="key"></i> Inputs and constraints</span>
      <span><i class="key key-warm"></i> Verification</span>
      <span><i class="key key-info"></i> Material selection</span>
      <span>All connections point toward the centre and return through audits.</span>
    </div>

  </figure>
  <p class="foot">Local, dependency-free diagram. Text remains selectable and the SVG exposes a title and description.</p>
</main>
</body>
</html>
